<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwarmGraph — Context Graph for AI Training Data</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
    --bg: #06060a;
    --bg-card: #0c0c12;
    --bg-hover: #12121a;
    --border: #1a1a24;
    --text: #c8c8d0;
    --text-muted: #64647a;
    --text-dim: #3a3a4a;
    --accent: #d4a017;
    --accent-dim: rgba(212,160,23,0.15);
    --royal: #d4a017;
    --honey: #a88a14;
    --propolis: #4a4a5a;
    --judge: #4a9eff;
    --writer: #ff6b6b;
    --silicon: #50c878;
    --anchor: #9b59b6;
    --mono: 'SF Mono','JetBrains Mono','Fira Code',monospace;
    --sans: 'Inter',-apple-system,sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--sans); background:var(--bg); color:var(--text); overflow-x:hidden; }

/* NAV */
.topbar {
    position:fixed; top:0; width:100%; z-index:100;
    background:rgba(6,6,10,0.92); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border); padding:0 24px; height:52px;
    display:flex; align-items:center; justify-content:space-between;
}
.topbar-logo { font-family:var(--mono); font-size:13px; color:var(--accent); letter-spacing:3px; font-weight:700; }
.topbar-stats { display:flex; gap:24px; }
.topbar-stat { font-family:var(--mono); font-size:11px; }
.topbar-stat .val { color:var(--text); font-weight:600; }
.topbar-stat .lbl { color:var(--text-dim); margin-left:4px; }

/* LAYOUT */
.main { display:grid; grid-template-columns:280px 1fr 320px; height:100vh; padding-top:52px; }
.sidebar { background:var(--bg-card); border-right:1px solid var(--border); overflow-y:auto; padding:16px; }
.graph-area { position:relative; overflow:hidden; }
.inspector { background:var(--bg-card); border-left:1px solid var(--border); overflow-y:auto; padding:16px; }

/* SIDEBAR */
.section-label { font-family:var(--mono); font-size:9px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin:16px 0 8px; }
.domain-card {
    background:var(--bg); border:1px solid var(--border); padding:12px; margin-bottom:8px; cursor:pointer; transition:border-color 0.2s;
}
.domain-card:hover { border-color:var(--accent); }
.domain-card.active { border-color:var(--accent); background:var(--accent-dim); }
.domain-name { font-weight:600; font-size:13px; margin-bottom:4px; }
.domain-count { font-family:var(--mono); font-size:11px; color:var(--text-muted); }
.domain-bar { display:flex; height:4px; margin-top:8px; gap:1px; }
.domain-bar .rj { background:var(--royal); }
.domain-bar .ho { background:var(--honey); }
.domain-bar .pr { background:var(--propolis); }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.stat-box { background:var(--bg); border:1px solid var(--border); padding:10px; text-align:center; }
.stat-val { font-family:var(--mono); font-size:18px; font-weight:700; }
.stat-lbl { font-family:var(--mono); font-size:9px; color:var(--text-muted); letter-spacing:1px; margin-top:2px; }

.judge-card { background:var(--bg); border:1px solid var(--border); padding:10px; margin-bottom:6px; }
.judge-name { font-family:var(--mono); font-size:11px; color:var(--judge); }
.judge-detail { font-size:11px; color:var(--text-muted); margin-top:4px; }
.judge-base { font-family:var(--mono); font-size:9px; color:var(--silicon); margin-top:2px; }

/* GRAPH SVG */
.graph-area svg { width:100%; height:100%; }
.node circle { cursor:pointer; stroke-width:2; }
.node text { font-family:var(--mono); font-size:8px; fill:var(--text-muted); pointer-events:none; }
.link { stroke-opacity:0.15; }
.link.highlighted { stroke-opacity:0.8; stroke-width:2; }
.node.highlighted circle { stroke-width:3; }

/* INSPECTOR */
.inspector-title { font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:2px; margin-bottom:16px; }
.detail-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px; }
.detail-key { color:var(--text-muted); font-family:var(--mono); font-size:10px; }
.detail-val { color:var(--text); font-family:var(--mono); font-size:10px; text-align:right; max-width:180px; word-break:break-all; }
.detail-val.rj { color:var(--royal); font-weight:700; }
.detail-val.ho { color:var(--honey); }
.detail-val.pr { color:var(--propolis); }
.detail-val.judge { color:var(--judge); }
.detail-val.anchor { color:var(--anchor); }

.proof-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:12px 0; }
.proof-box { background:var(--bg); border:1px solid var(--border); padding:8px; text-align:center; }
.proof-box.active { border-color:var(--accent); }
.proof-num { font-family:var(--mono); font-size:9px; color:var(--accent); }
.proof-name { font-size:10px; margin-top:2px; }

.trace-chain { margin-top:12px; }
.trace-step { display:flex; align-items:flex-start; gap:8px; padding:6px 0; }
.trace-dot { width:8px; height:8px; border-radius:50%; margin-top:4px; flex-shrink:0; }
.trace-line { border-left:1px solid var(--border); margin-left:3px; padding-left:12px; padding-bottom:8px; }
.trace-type { font-family:var(--mono); font-size:9px; color:var(--text-dim); }
.trace-id { font-family:var(--mono); font-size:10px; color:var(--text); }

/* SEARCH */
.search-box { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px;
    font-family:var(--mono); font-size:11px; outline:none; margin-bottom:12px; }
.search-box:focus { border-color:var(--accent); }
.search-box::placeholder { color:var(--text-dim); }

/* LEGEND */
.legend { display:flex; flex-wrap:wrap; gap:12px; padding:8px 0; }
.legend-item { display:flex; align-items:center; gap:4px; font-family:var(--mono); font-size:9px; color:var(--text-muted); }
.legend-dot { width:8px; height:8px; border-radius:50%; }

/* COOK BANNER */
.cook-banner {
    position:absolute; bottom:16px; left:16px; right:16px; z-index:10;
    background:rgba(12,12,18,0.95); border:1px solid var(--border); padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:11px; backdrop-filter:blur(8px);
}
.cook-status { color:var(--accent); }
.cook-detail { color:var(--text-muted); }

@media(max-width:1024px) {
    .main { grid-template-columns:1fr; }
    .sidebar, .inspector { display:none; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">SWARMGRAPH</div>
    <div class="topbar-stats" id="topbar-stats"></div>
</div>

<div class="main">
    <div class="sidebar" id="sidebar">
        <input class="search-box" id="search" placeholder="Search nodes...">

        <div class="section-label">Overview</div>
        <div class="stat-grid" id="overview-stats"></div>

        <div class="section-label">Domains</div>
        <div id="domain-list"></div>

        <div class="section-label">Judges</div>
        <div id="judge-list"></div>

        <div class="section-label">Silicon</div>
        <div id="silicon-list"></div>

        <div class="section-label">Legend</div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--royal)"></div>Royal Jelly</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--honey)"></div>Honey</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--propolis)"></div>Propolis</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--judge)"></div>Judge</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--writer)"></div>Writer</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--silicon)"></div>Silicon</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--anchor)"></div>Anchor</div>
        </div>
    </div>

    <div class="graph-area" id="graph-area">
        <svg id="graph-svg"></svg>
        <div class="cook-banner">
            <span class="cook-status">LOADING...</span>
            <span class="cook-detail" id="finality-status">Finality pipeline status loading</span>
        </div>
    </div>

    <div class="inspector" id="inspector">
        <div class="inspector-title">NODE INSPECTOR</div>
        <div id="inspector-content">
            <p style="color:var(--text-dim);font-size:12px;">Click a node in the graph to inspect it.</p>
        </div>
    </div>
</div>

<script>
// ─── LOAD DATA ───
let graphData = null;
let simulation = null;
let selectedNode = null;

async function loadGraph() {
    try {
        const resp = await fetch('swarmgraph_data.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        graphData = await resp.json();
        document.querySelector('.cook-status').textContent = `EXPORTED ${graphData.summary.exported_at || ''}`;
    } catch(e) {
        console.error('[swarmgraph] Failed to load graph data:', e);
        graphData = {summary:{total_nodes:0,total_edges:0,total_pairs:0,total_scored:0,tier_distribution:{},domain_pairs:{},finality:{}},nodes:[],edges:[]};
        document.querySelector('.cook-status').textContent = 'NO DATA — export required';
    }
    initDashboard();
    initGraph();
}

// ─── COLORS ───
function nodeColor(node) {
    const t = node.type;
    const p = node.properties || {};
    if (t === 'deed') {
        if (p.tier === 'royal-jelly') return '#d4a017';
        if (p.tier === 'honey') return '#a88a14';
        return '#4a4a5a';
    }
    if (t === 'pair') return '#2a4a6a';
    if (t === 'judge') return '#4a9eff';
    if (t === 'writer') return '#ff6b6b';
    if (t === 'silicon') return '#50c878';
    if (t === 'anchor') return '#9b59b6';
    if (t === 'batch') return '#7a5ab8';
    if (t === 'domain') return '#e67e22';
    return '#4a4a5a';
}

function nodeRadius(node) {
    const t = node.type;
    if (t === 'domain') return 14;
    if (t === 'judge') return 12;
    if (t === 'writer') return 14;
    if (t === 'silicon') return 10;
    if (t === 'anchor') return 10;
    if (t === 'batch') return 8;
    if (t === 'deed') return 4;
    if (t === 'pair') return 3;
    return 5;
}

function nodeLabel(node) {
    const t = node.type;
    const p = node.properties || {};
    if (t === 'domain') return p.name || node.id;
    if (t === 'judge') return p.label || node.id;
    if (t === 'writer') return 'gemma-4-31b';
    if (t === 'silicon') return node.id.replace('silicon:', '');
    if (t === 'anchor') return 'hedera';
    return '';
}

// ─── DASHBOARD ───
function initDashboard() {
    const s = graphData.summary;
    const nodes = graphData.nodes;
    const edges = graphData.edges;

    // Topbar stats
    const rjCount = s.tier_distribution['royal-jelly'] || 0;
    document.getElementById('topbar-stats').innerHTML = `
        <div class="topbar-stat"><span class="val">${(s.total_pairs||0).toLocaleString()}</span><span class="lbl">pairs</span></div>
        <div class="topbar-stat"><span class="val">${(s.total_scored||0).toLocaleString()}</span><span class="lbl">scored</span></div>
        <div class="topbar-stat"><span class="val">${rjCount.toLocaleString()}</span><span class="lbl">royal jelly</span></div>
        <div class="topbar-stat"><span class="val">${s.total_nodes}</span><span class="lbl">nodes</span></div>
    `;

    // Overview stats
    const rj = s.tier_distribution['royal-jelly'] || 0;
    const ho = s.tier_distribution['honey'] || 0;
    const pr = s.tier_distribution['propolis'] || 0;
    const total = rj + ho + pr;

    document.getElementById('overview-stats').innerHTML = `
        <div class="stat-box"><div class="stat-val" style="color:var(--royal)">${rj}</div><div class="stat-lbl">Royal Jelly</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--honey)">${ho}</div><div class="stat-lbl">Honey</div></div>
        <div class="stat-box"><div class="stat-val">${total}</div><div class="stat-lbl">Total Deeds</div></div>
        <div class="stat-box"><div class="stat-val">${total > 0 ? Math.round(rj/total*100) : 0}%</div><div class="stat-lbl">RJ Yield</div></div>
    `;

    // Finality pipeline status
    const fin = s.finality || {};
    const fParts = [];
    if (fin.layer_1_postgresql) fParts.push(`L1:${fin.layer_1_postgresql.status} (${(fin.layer_1_postgresql.pairs_scored||0).toLocaleString()} scored)`);
    if (fin.layer_2_minio) fParts.push(`L2:${fin.layer_2_minio.status}`);
    if (fin.layer_3_ipfs) fParts.push(`L3:${fin.layer_3_ipfs.status}`);
    if (fin.layer_4_hedera) fParts.push(`L4:${fin.layer_4_hedera.status}`);
    if (fin.layer_5_ens) fParts.push(`L5:${fin.layer_5_ens.status}`);
    const finEl = document.getElementById('finality-status');
    if (finEl) finEl.textContent = fParts.join(' | ') || 'No finality data';

    // Domain list
    const domains = {};
    nodes.filter(n => n.type === 'deed').forEach(n => {
        const d = n.properties.domain || 'unknown';
        if (!domains[d]) domains[d] = {rj:0, ho:0, pr:0, total:0};
        domains[d].total++;
        if (n.properties.tier === 'royal-jelly') domains[d].rj++;
        else if (n.properties.tier === 'honey') domains[d].ho++;
        else domains[d].pr++;
    });

    document.getElementById('domain-list').innerHTML = Object.entries(domains)
        .sort((a,b) => b[1].total - a[1].total)
        .map(([name, d]) => {
            const rjP = d.total > 0 ? (d.rj/d.total*100) : 0;
            const hoP = d.total > 0 ? (d.ho/d.total*100) : 0;
            const prP = d.total > 0 ? (d.pr/d.total*100) : 0;
            return `<div class="domain-card" onclick="filterDomain('${name}')">
                <div class="domain-name">${name}</div>
                <div class="domain-count">${d.total} deeds · ${d.rj} RJ (${Math.round(rjP)}%)</div>
                <div class="domain-bar">
                    <div class="rj" style="flex:${rjP}"></div>
                    <div class="ho" style="flex:${hoP}"></div>
                    <div class="pr" style="flex:${prP}"></div>
                </div>
            </div>`;
        }).join('');

    // Judge list
    document.getElementById('judge-list').innerHTML = nodes.filter(n => n.type === 'judge')
        .map(n => `<div class="judge-card">
            <div class="judge-name">${n.properties.label || n.id}</div>
            <div class="judge-detail">${n.properties.model || ''}</div>
            <div class="judge-base">BASE · UNMODIFIED · DETERMINISTIC</div>
        </div>`).join('');

    // Silicon list
    document.getElementById('silicon-list').innerHTML = nodes.filter(n => n.type === 'silicon')
        .map(n => `<div class="judge-card">
            <div class="judge-name" style="color:var(--silicon)">${n.id.replace('silicon:','')}</div>
            <div class="judge-detail">${n.properties.hardware || ''}</div>
            <div class="judge-base">${n.properties.arch} · ${n.properties.power_watts}W · ${n.properties.location}</div>
        </div>`).join('');

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        if (!q) { resetHighlight(); return; }
        const matches = graphData.nodes.filter(n => n.id.toLowerCase().includes(q) || JSON.stringify(n.properties).toLowerCase().includes(q));
        highlightNodes(matches.map(n => n.id));
    });
}

// ─── FORCE GRAPH ───
function initGraph() {
    const container = document.getElementById('graph-area');
    const width = container.clientWidth;
    const height = container.clientHeight;
    const svg = d3.select('#graph-svg').attr('viewBox', [0, 0, width, height]);
    svg.selectAll('*').remove();

    // Filter: skip pair nodes for cleaner viz (too many), keep only structural nodes + deeds
    const showTypes = new Set(['deed', 'judge', 'writer', 'silicon', 'anchor', 'batch', 'domain']);
    const visibleNodes = graphData.nodes.filter(n => showTypes.has(n.type));
    const visibleIds = new Set(visibleNodes.map(n => n.id));
    const visibleEdges = graphData.edges.filter(e => visibleIds.has(e.source) && visibleIds.has(e.target));

    // D3 force simulation
    const nodeData = visibleNodes.map(n => ({...n, x: width/2 + Math.random()*100, y: height/2 + Math.random()*100}));
    const linkData = visibleEdges.map(e => ({source: e.source, target: e.target, type: e.type}));

    simulation = d3.forceSimulation(nodeData)
        .force('link', d3.forceLink(linkData).id(d => d.id).distance(30).strength(0.3))
        .force('charge', d3.forceManyBody().strength(-40))
        .force('center', d3.forceCenter(width/2, height/2))
        .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 2))
        .force('x', d3.forceX(width/2).strength(0.03))
        .force('y', d3.forceY(height/2).strength(0.03));

    // Links
    const link = svg.append('g')
        .selectAll('line')
        .data(linkData)
        .join('line')
        .attr('class', 'link')
        .attr('stroke', '#1a1a2a')
        .attr('stroke-width', 0.5);

    // Nodes
    const node = svg.append('g')
        .selectAll('g')
        .data(nodeData)
        .join('g')
        .attr('class', 'node')
        .call(d3.drag()
            .on('start', dragstarted)
            .on('drag', dragged)
            .on('end', dragended))
        .on('click', (event, d) => inspectNode(d));

    node.append('circle')
        .attr('r', d => nodeRadius(d))
        .attr('fill', d => nodeColor(d))
        .attr('stroke', d => nodeColor(d))
        .attr('stroke-opacity', 0.3)
        .attr('fill-opacity', 0.8);

    node.filter(d => nodeLabel(d))
        .append('text')
        .text(d => nodeLabel(d))
        .attr('dy', d => nodeRadius(d) + 10)
        .attr('text-anchor', 'middle');

    simulation.on('tick', () => {
        link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    // Zoom
    const zoom = d3.zoom().scaleExtent([0.3, 5]).on('zoom', (event) => {
        svg.selectAll('g').attr('transform', event.transform);
    });
    svg.call(zoom);

    function dragstarted(event) { if (!event.active) simulation.alphaTarget(0.3).restart(); event.subject.fx = event.subject.x; event.subject.fy = event.subject.y; }
    function dragged(event) { event.subject.fx = event.x; event.subject.fy = event.y; }
    function dragended(event) { if (!event.active) simulation.alphaTarget(0); event.subject.fx = null; event.subject.fy = null; }
}

// ─── INSPECTOR ───
function inspectNode(node) {
    selectedNode = node;
    const p = node.properties || {};
    const content = document.getElementById('inspector-content');

    let html = `<div class="detail-row"><span class="detail-key">ID</span><span class="detail-val">${node.id}</span></div>`;
    html += `<div class="detail-row"><span class="detail-key">TYPE</span><span class="detail-val">${node.type.toUpperCase()}</span></div>`;

    if (node.type === 'deed') {
        const tierClass = p.tier === 'royal-jelly' ? 'rj' : p.tier === 'honey' ? 'ho' : 'pr';
        html += `<div class="detail-row"><span class="detail-key">SCORE</span><span class="detail-val ${tierClass}">${p.final_score}</span></div>`;
        html += `<div class="detail-row"><span class="detail-key">TIER</span><span class="detail-val ${tierClass}">${(p.tier||'').replace('_',' ').toUpperCase()}</span></div>`;
        html += `<div class="detail-row"><span class="detail-key">DOMAIN</span><span class="detail-val">${p.domain}</span></div>`;
        html += `<div class="detail-row"><span class="detail-key">DRIFT</span><span class="detail-val">${p.drift || '—'}</span></div>`;
        html += `<div class="detail-row"><span class="detail-key">SEALED</span><span class="detail-val">${p.sealed_at || '—'}</span></div>`;

        html += `<div class="section-label" style="margin-top:16px">FIVE PROOFS</div>`;
        html += `<div class="proof-grid">
            <div class="proof-box active"><div class="proof-num">01</div><div class="proof-name">Origin</div></div>
            <div class="proof-box active"><div class="proof-num">02</div><div class="proof-name">Quality</div></div>
            <div class="proof-box active"><div class="proof-num">03</div><div class="proof-name">Process</div></div>
            <div class="proof-box"><div class="proof-num">04</div><div class="proof-name">Economics</div></div>
            <div class="proof-box"><div class="proof-num">05</div><div class="proof-name">Trust</div></div>
        </div>`;
    }

    // Show connected edges
    const incoming = graphData.edges.filter(e => e.target === node.id);
    const outgoing = graphData.edges.filter(e => e.source === node.id);

    if (incoming.length > 0 || outgoing.length > 0) {
        html += `<div class="section-label" style="margin-top:16px">CONNECTIONS</div>`;
        html += `<div class="detail-row"><span class="detail-key">INCOMING</span><span class="detail-val">${incoming.length}</span></div>`;
        html += `<div class="detail-row"><span class="detail-key">OUTGOING</span><span class="detail-val">${outgoing.length}</span></div>`;

        // Show trace
        html += `<div class="section-label" style="margin-top:12px">PROVENANCE TRACE</div><div class="trace-chain">`;
        const traceEdges = [...incoming.slice(0, 5), ...outgoing.slice(0, 5)];
        traceEdges.forEach(e => {
            const isIn = e.target === node.id;
            const otherId = isIn ? e.source : e.target;
            const otherNode = graphData.nodes.find(n => n.id === otherId);
            const color = otherNode ? nodeColor(otherNode) : '#4a4a5a';
            html += `<div class="trace-step">
                <div class="trace-dot" style="background:${color}"></div>
                <div><div class="trace-type">${isIn ? '← ' : '→ '}${e.type}</div>
                <div class="trace-id" style="cursor:pointer" onclick="selectById('${otherId}')">${otherId}</div></div>
            </div>`;
        });
        html += `</div>`;
    }

    // Properties dump
    const propEntries = Object.entries(p).filter(([k]) => !['tier','final_score','domain','drift','sealed_at'].includes(k));
    if (propEntries.length > 0) {
        html += `<div class="section-label" style="margin-top:16px">PROPERTIES</div>`;
        propEntries.forEach(([k, v]) => {
            html += `<div class="detail-row"><span class="detail-key">${k.toUpperCase()}</span><span class="detail-val">${typeof v === 'object' ? JSON.stringify(v) : v}</span></div>`;
        });
    }

    content.innerHTML = html;
}

function selectById(id) {
    const node = graphData.nodes.find(n => n.id === id);
    if (node) inspectNode(node);
}

function filterDomain(domain) {
    document.querySelectorAll('.domain-card').forEach(c => c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    const matches = graphData.nodes.filter(n => n.properties && n.properties.domain === domain);
    highlightNodes(matches.map(n => n.id));
}

function highlightNodes(ids) {
    const idSet = new Set(ids);
    d3.selectAll('.node').classed('highlighted', d => idSet.has(d.id)).select('circle').attr('opacity', d => idSet.has(d.id) ? 1 : 0.15);
    d3.selectAll('.link').classed('highlighted', d => idSet.has(d.source.id) || idSet.has(d.target.id)).attr('stroke-opacity', d => (idSet.has(d.source.id) || idSet.has(d.target.id)) ? 0.6 : 0.05);
}

function resetHighlight() {
    d3.selectAll('.node circle').attr('opacity', 0.8);
    d3.selectAll('.link').attr('stroke-opacity', 0.15).classed('highlighted', false);
    d3.selectAll('.node').classed('highlighted', false);
    document.querySelectorAll('.domain-card').forEach(c => c.classList.remove('active'));
}

// ─── INIT ───
loadGraph();
</script>
</body>
</html>
